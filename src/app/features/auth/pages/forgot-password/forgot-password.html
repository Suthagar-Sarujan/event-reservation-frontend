<app-auth-shell>
  <form class="auth-card" (ngSubmit)="submit()" #form="ngForm">
    @if (!submitted()) {
      <div class="auth-card-header">
        <h1>Forgot Your Password?</h1>
        <p class="subtitle">Enter the email address associated with your Eventify account.</p>
      </div>

      <p-fluid>
        <div class="form-field">
          <label for="email">Email</label>
          <p-iconfield>
            <p-inputicon class="pi pi-envelope" />
            <input pInputText id="email" name="email" type="email" placeholder="you@example.com" [(ngModel)]="email" required
              autocomplete="email" />
          </p-iconfield>
        </div>
      </p-fluid>

      @if (error(); as errorMessage) {
        <p-message severity="error" [text]="errorMessage" styleClass="w-full" />
      }

      <p-button type="submit" [label]="loading() ? 'Sending...' : 'Send Reset Link'" [loading]="loading()"
        [disabled]="form.invalid || loading()" [style]="{ width: '100%' }" icon="pi pi-arrow-right" iconPos="right" />

      <p class="switch-link">
        <a routerLink="/login"><i class="pi pi-arrow-left"></i> Back to Login</a>
      </p>
    } @else {
      <div class="auth-card-header">
        <h1>Check your email</h1>
        <p class="subtitle">If an account exists for this email address, password reset instructions have been sent.</p>
      </div>

      <p class="switch-link">
        <a routerLink="/login"><i class="pi pi-arrow-left"></i> Back to Login</a>
      </p>
    }
  </form>
</app-auth-shell>
