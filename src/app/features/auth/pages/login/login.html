<app-auth-shell>
  <form class="auth-card" (ngSubmit)="submit()" #form="ngForm">
    <div class="auth-card-header">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to book tickets and see recommendations tailored to you.</p>
    </div>

    <p-fluid>
      <div class="form-field">
        <label for="email">Email</label>
        <p-iconfield>
          <p-inputicon class="pi pi-envelope" />
          <input pInputText id="email" name="email" type="email" placeholder="you@example.com" [(ngModel)]="email" required
            autocomplete="email" />
        </p-iconfield>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <p-password id="password" name="password" [(ngModel)]="password" [toggleMask]="true" [feedback]="false"
          placeholder="••••••••" required autocomplete="current-password" />
      </div>
    </p-fluid>

    @if (error(); as errorMessage) {
      <p-message severity="error" [text]="errorMessage" styleClass="w-full" />
    }

    <p-button type="submit" [label]="loading() ? 'Signing in...' : 'Log in'" [loading]="loading()"
      [disabled]="form.invalid || loading()" [style]="{ width: '100%' }" icon="pi pi-arrow-right" iconPos="right" />

    <p class="forgot-link">
      <a routerLink="/forgot-password">Forgot Password?</a>
    </p>

    <p class="switch-link">
      No account yet?
      <a routerLink="/register">Sign up <i class="pi pi-arrow-right"></i></a>
    </p>
  </form>
</app-auth-shell>
