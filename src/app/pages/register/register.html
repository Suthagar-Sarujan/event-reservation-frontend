<app-auth-shell>
  <form class="auth-card" (ngSubmit)="submit()" #form="ngForm">
    <div class="auth-card-header">
      <h1>Create your account</h1>
      <p class="subtitle">Sign up to book tickets and unlock personalized recommendations.</p>
    </div>

    <p-fluid>
      <div class="form-field">
        <label for="fullName">Full name</label>
        <p-iconfield>
          <p-inputicon class="pi pi-user" />
          <input pInputText id="fullName" name="fullName" type="text" placeholder="Jane Doe" [(ngModel)]="fullName" required
            minlength="2" autocomplete="name" />
        </p-iconfield>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <p-iconfield>
          <p-inputicon class="pi pi-envelope" />
          <input pInputText id="email" name="email" type="email" placeholder="you@example.com" [(ngModel)]="email" required
            autocomplete="email" />
        </p-iconfield>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <p-password id="password" name="password" [(ngModel)]="password" [toggleMask]="true" [feedback]="false"
          placeholder="••••••••" required [minlength]="8" autocomplete="new-password" />
        <span class="field-hint">At least 8 characters.</span>
      </div>
    </p-fluid>

    @if (error(); as errorMessage) {
      <p-message severity="error" [text]="errorMessage" styleClass="w-full" />
    }

    <p-button type="submit" [label]="loading() ? 'Creating account...' : 'Sign up'" [loading]="loading()"
      [disabled]="form.invalid || loading()" [style]="{ width: '100%' }" icon="pi pi-arrow-right" iconPos="right" />

    <p class="switch-link">
      Already have an account?
      <a routerLink="/login">Log in <i class="pi pi-arrow-right"></i></a>
    </p>
  </form>
</app-auth-shell>
