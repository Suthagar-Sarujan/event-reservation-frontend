<div class="page-header">
  <div>
    <h1>Users</h1>
    <p>{{ total() }} registered accounts</p>
  </div>
</div>

<div class="inline-form">
  <p-iconfield>
    <p-inputicon class="pi pi-search" />
    <input pInputText type="search" placeholder="Search by name or email..." [(ngModel)]="search" (keyup.enter)="load()" />
  </p-iconfield>
  <p-button label="Search" severity="secondary" (click)="load()" />
</div>

@if (error(); as errorMessage) {
  <p-message severity="error" [text]="errorMessage" styleClass="w-full" />
}

@if (loading()) {
  <app-skeleton-table [rows]="6" />
} @else if (users().length === 0) {
  <app-empty-state icon="users" title="No users found" description="Try a different search term." />
} @else {
  <p-table [value]="users()" dataKey="userId" [rowHover]="true" styleClass="p-datatable-app">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Joined</th>
        <th>Change role</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-u>
      <tr>
        <td class="user-name">
          <span class="avatar-sm">{{ u.fullName[0] }}</span>
          {{ u.fullName }}
        </td>
        <td>{{ u.email }}</td>
        <td><span class="role-badge">{{ u.role }}</span></td>
        <td>{{ u.createdAt | date: 'mediumDate' }}</td>
        <td>
          <p-select
            [ngModel]="u.role.toLowerCase()"
            (ngModelChange)="changeRole(u, $event)"
            [disabled]="savingUserId() === u.userId"
            [options]="roleOptions"
            optionLabel="label"
            optionValue="value"
            styleClass="role-select"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
}
