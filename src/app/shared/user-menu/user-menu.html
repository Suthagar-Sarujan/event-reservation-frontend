<div class="dropdown">
  <button class="trigger" (click)="toggle(); $event.stopPropagation()" [class.open]="open()">
    <span class="avatar">{{ initials() }}</span>
    <span class="trigger-text">
      <span class="trigger-name">{{ auth.currentUser()?.fullName }}</span>
      <span class="trigger-role">{{ auth.currentUser()?.role }}</span>
    </span>
    <app-icon name="chevron-down" class="chevron" />
  </button>

  @if (open()) {
    <div class="dropdown-menu">
      <div class="dropdown-header">
        <div class="name">{{ auth.currentUser()?.fullName }}</div>
        <div class="email">{{ auth.currentUser()?.email }}</div>
      </div>
      <div class="dropdown-divider"></div>

      <a class="dropdown-item" routerLink="/dashboard" (click)="close()">
        <app-icon name="layout-dashboard" /> Dashboard
      </a>
      <a class="dropdown-item" routerLink="/my-bookings" (click)="close()">
        <app-icon name="ticket" /> My Bookings
      </a>
      @if (auth.isOrganizer()) {
        <a class="dropdown-item" routerLink="/organizer" (click)="close()">
          <app-icon name="briefcase" /> Organizer Panel
        </a>
      }
      @if (auth.isAdmin()) {
        <a class="dropdown-item" routerLink="/admin" (click)="close()">
          <app-icon name="shield" /> Admin Panel
        </a>
      }

      <div class="dropdown-divider"></div>
      <button class="dropdown-item danger" (click)="logout()">
        <app-icon name="log-out" /> Log out
      </button>
    </div>
  }
</div>
