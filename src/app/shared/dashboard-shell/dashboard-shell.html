<div class="shell">
  @if (sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <a class="sidebar-brand" routerLink="/">
      <span class="brand-mark"><app-icon name="ticket" /></span>
      EventReserve
    </a>

    <div class="sidebar-section-label">{{ variant === 'admin' ? 'Administration' : 'Organizer' }}</div>
    <nav class="sidebar-nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          (click)="closeSidebar()"
        >
          <app-icon [name]="item.icon" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a class="back-to-site" routerLink="/">
        <app-icon name="arrow-left" /> Back to site
      </a>
    </div>
  </aside>

  <div class="shell-main">
    <div class="shell-topbar">
      <button class="sidebar-toggle btn-icon btn-ghost" (click)="toggleSidebar()" aria-label="Toggle menu">
        <app-icon name="menu" />
      </button>
      <span class="topbar-title">{{ variant === 'admin' ? 'Admin Panel' : 'Organizer Panel' }}</span>
      <app-user-menu />
    </div>

    <div class="shell-content">
      <router-outlet />
    </div>
  </div>
</div>
