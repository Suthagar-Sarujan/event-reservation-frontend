<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eventify</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applies the saved/system theme before the first paint, so there's no
    // flash of the wrong theme while Angular's bundle is still loading.
    (function () {
      try {
        var pref = localStorage.getItem('event_reservation_theme');
        var isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
